services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cloudguard-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DATA_DIR: /app/data/scenarios
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      DATA_FRESHNESS_THRESHOLD_MINUTES: ${DATA_FRESHNESS_THRESHOLD_MINUTES:-15}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 8s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudguard-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 5s
